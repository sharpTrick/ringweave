# Builds the production site plus a preview of every open same-repo PR into one
# GitHub Pages artifact, then deploys it. No gh-pages branch — pure Actions artifact.
#
#   production        -> https://sharptrick.github.io/ringweave/
#   preview of PR #N  -> https://sharptrick.github.io/ringweave/pr-preview/pr-N/
#
# One-time repo settings required (see the PR description):
#   1. Settings -> Pages -> Source: "GitHub Actions".
#   2. Settings -> Environments -> github-pages -> Deployment branches: allow
#      refs/pull/*/merge (or "No restriction"), so pull_request runs may deploy.
#
# Security model (deliberate): this single job builds each open PR's code and
# also holds pages:write / id-token:write. That is safe here because ONLY
# same-repo PRs are ever built — fork PRs are excluded (job `if:` + the
# isCrossRepository filter) and never run. Same-repo PR authors already have
# push access, so they have strictly more direct attack vectors than a preview
# build; hardening against them specifically buys little. We still minimize
# blast radius: GH_TOKEN is scoped to the PR-list step (not the untrusted build
# step), each preview build is sandboxed/time-boxed, and the job is bounded by
# timeout-minutes. If less-trusted collaborators ever get push access, split
# this into an unprivileged pull_request build + a privileged workflow_run deploy.

name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write   # for the sticky preview-URL comment

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    # Skip fork PRs — they get no token/env access, so their preview can't deploy.
    # Same-repo PRs + pushes to main only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30    # bound the PR build loop; a hung/malicious build can't pin the runner
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always start from main: production is built from main's tip, and each PR
      # preview is built by fetching that PR's head inside the build loop below.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # setup-node's built-in `cache: npm` is not used here: this job checks out
      # `main` and then each PR head in turn, so `app/package-lock.json` may be
      # absent (e.g. on a `main` that predates the app) or differ per ref, which
      # makes a single cache-dependency-path resolve to nothing and hard-fail.
      # Cache the shared npm download dir instead, keyed on any lockfile present.
      - name: Cache ~/.npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: List open same-repo PRs
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keep the token scoped to THIS step. The build step below executes
          # untrusted PR-authored code (npm lifecycle scripts, vite.config.ts) and
          # must not inherit GH_TOKEN. An assignment on its own line also lets a
          # `gh` failure trip set -e, instead of a `for … in $(gh …)` swallowing it
          # and silently deploying a site with every preview removed.
          nums="$(gh pr list --state open --json number,isCrossRepository \
                    --jq '.[] | select(.isCrossRepository==false) | .number' | tr '\n' ' ')"
          echo "numbers=$nums" >> "$GITHUB_OUTPUT"

      - name: Build production + all open PR previews
        env:
          PR_NUMBERS: ${{ steps.prs.outputs.numbers }}
        run: |
          set -euo pipefail
          SITE="$PWD/_site"; rm -rf "$SITE"; mkdir -p "$SITE"

          # Build the checked-out working tree into $2, served from base path $1.
          # $CAP is an optional command prefix (e.g. "timeout 600") on the heavy npm
          # steps — empty for production, a wall-clock cap for each PR preview.
          build_into () {  # $1=base path  $2=dest dir
            mkdir -p "$2"
            if [ ! -f app/package.json ]; then
              # Older ref without the app yet — emit a placeholder so the deploy
              # still succeeds instead of failing the whole run.
              printf '<!doctype html><meta charset="utf-8"><title>ringweave</title><p>Coming soon.</p>\n' > "$2/index.html"
              return
            fi
            ${CAP} npm --prefix app ci
            VITE_BASE="$1" ${CAP} npm --prefix app run build
            cp -a app/dist/. "$2"/
          }

          # Production, from the tip of main. A failure here SHOULD fail the deploy,
          # so it runs uncapped under set -e and is not wrapped below.
          CAP=""
          build_into "/ringweave/" "$SITE"

          # One preview per open, same-repo (non-fork) PR. One bad PR must not abort
          # the production deploy, so each preview is isolated: fetch + build in a
          # subshell, time-boxed; failures are logged and skipped.
          for pr in $PR_NUMBERS; do
            echo "::group::Building preview for PR #$pr"
            if git fetch --no-tags origin "pull/$pr/head" \
               && git checkout -f -q FETCH_HEAD \
               && ( CAP="timeout 600"; build_into "/ringweave/pr-preview/pr-$pr/" "$SITE/pr-preview/pr-$pr" ); then
              :
            else
              echo "::warning::preview build failed for PR #$pr — skipping"
              rm -rf "$SITE/pr-preview/pr-$pr"
            fi
            git checkout -f -q main
            echo "::endgroup::"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          number: ${{ github.event.pull_request.number }}
          header: pages-preview
          message: |
            ### 🔎 Preview deployed

            **https://sharptrick.github.io/ringweave/pr-preview/pr-${{ github.event.pull_request.number }}/**

            Rebuilt on every push to this PR (note the trailing slash). Removed from
            the site automatically once the PR is closed.
