name: CI

on:
  push:
    branches: [main, master]
  pull_request:

defaults:
  run:
    working-directory: lib

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lib/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Build the core first: the app consumes it via `file:../lib` (→ lib/dist),
      # which is gitignored and has no `prepare` script, so it must be built before
      # the app installs/typechecks/builds. `working-directory` is set per step to
      # override the workflow-level `lib` default.
      - run: npm ci
        working-directory: lib
      - run: npm run build
        working-directory: lib
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      # The hygiene gate runs in this job because it needs BOTH packages installed: knip resolves
      # app's `ringweave` import through app/node_modules, so a standalone lint job would either
      # duplicate the whole install or report false "unresolved import" noise.
      #
      # docs/REVIEW_PROTOCOL.md puts every class this gate covers OUT OF SCOPE for the adversarial
      # critics, so it has to be enforced somewhere that cannot be skipped. `lint` also self-tests:
      # it asserts each lint rule and custom check still fires on a deliberate violation, because a
      # silently-dead rule is indistinguishable from a clean tree.
      - run: npm ci
        working-directory: .
      - run: npm run lint
        working-directory: .
